name: StocksBrain 24/7 Monitor

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours
  workflow_dispatch:          # Manual trigger

permissions:
  issues: write
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        run: python -m monitor.run
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Commit alert output
        run: |
          git config user.name "StocksBrain Monitor"
          git config user.email "actions@github.com"
          git add alerts/ || true
          git diff --cached --quiet && echo "No alert changes" || git commit -m "monitor: $(date -u +%Y-%m-%d-%H%M) run results"
          git push || true
