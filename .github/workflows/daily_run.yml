name: StocksBrain Daily Run

on:
  schedule:
    - cron: '0 22 * * 0-4'  # Mon-Fri 2:00 AM Dubai (UTC+4)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests beautifulsoup4 pandas numpy

      - name: Run StocksBrain
        run: python orchestrator.py

      - name: Commit output
        run: |
          git config user.name "StocksBrain Bot"
          git config user.email "bot@stocksbrain.local"
          git add output/
          git diff --cached --quiet || git commit -m "StocksBrain daily run $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Run monitor after daily run
        run: python -m monitor.run
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        continue-on-error: true
